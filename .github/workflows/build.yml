name: Build Project

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  check-secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are set
        shell: bash
        run: |
          missing=()
          [ -z "$UNITY_LICENSE" ]  && missing+=(UNITY_LICENSE)
          [ -z "$UNITY_EMAIL" ]    && missing+=(UNITY_EMAIL)
          [ -z "$UNITY_PASSWORD" ] && missing+=(UNITY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  read-version:
    name: Read Unity version
    runs-on: ubuntu-latest
    outputs:
      unity_version: ${{ steps.get-version.outputs.unity_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: ProjectSettings/ProjectVersion.txt
          sparse-checkout-cone-mode: false

      - name: Extract Unity version
        id: get-version
        shell: bash
        run: |
          version=$(grep "^m_EditorVersion:" ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "unity_version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected Unity version: $version"

  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.runsOn }}
    needs: [check-secrets, read-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            runsOn: windows-2022
          - targetPlatform: StandaloneLinux64
            runsOn: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.read-version.outputs.unity_version }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Nox.GameBuilder.Pipeline.ExternalBuilder.Build
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
