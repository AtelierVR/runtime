name: Build Project

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are set
        shell: bash
        run: |
          missing=()
          [ -z "$UNITY_LICENSE" ]  && missing+=(UNITY_LICENSE)
          [ -z "$UNITY_EMAIL" ]    && missing+=(UNITY_EMAIL)
          [ -z "$UNITY_PASSWORD" ] && missing+=(UNITY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  read-version:
    name: Read Unity version
    runs-on: ubuntu-latest
    outputs:
      unity_version: ${{ steps.get-version.outputs.unity_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: ProjectSettings/ProjectVersion.txt
          sparse-checkout-cone-mode: false

      - name: Extract Unity version
        id: get-version
        shell: bash
        run: |
          version=$(grep "^m_EditorVersion:" ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "unity_version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected Unity version: $version"

  release-meta:
    name: Compute release version and channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.compute.outputs.channel }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      release_name: ${{ steps.compute.outputs.release_name }}
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute weekly version and channel
        id: compute
        shell: bash
        run: |
          raw_channel="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          channel="$(echo "$raw_channel" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#-+#-#g; s#^-+##; s#-+$##')"
          if [ -z "$channel" ]; then
            channel="unknown"
          fi

          current_year="$(date -u +%G)"
          year="$((current_year - 2000))"
          week="$(date -u +%V)"
          prefix="v${year}.${week}."
          pattern="${prefix}*-${channel}"

          max_build="$({
            git tag -l "$pattern" \
              | sed -E "s#^v${year}\\.${week}\\.([0-9]+)-${channel}$#\\1#" \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -1
          } || true)"

          if [ -z "$max_build" ]; then
            max_build=0
          fi

          build_num=$((max_build + 1))
          version="${year}.${week}.${build_num}"
          tag="${channel}"
          release_name="Runtime ${version} (${channel})"

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "Computed release: ${tag}/v${version}"

  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.runsOn }}
    needs: [check-secrets, read-version, release-meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            runsOn: ubuntu-latest
          - targetPlatform: StandaloneLinux64
            runsOn: ubuntu-latest
          - targetPlatform: StandaloneOSX
            runsOn: ubuntu-latest
          - targetPlatform: Android
            runsOn: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.read-version.outputs.unity_version }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Nox.GameBuilder.Pipeline.ExternalBuilder.Build
          buildsPath: build
          allowDirtyBuild: true
          customParameters: -noxReleaseVersion "${{ needs.release-meta.outputs.version }}" -noxReleaseChannel "${{ needs.release-meta.outputs.channel }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}-${{ needs.release-meta.outputs.tag }}
          path: build/${{ matrix.targetPlatform }}

  release:
    name: Create release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build, release-meta]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Build-*-${{ needs.release-meta.outputs.tag }}
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: ${{ needs.release-meta.outputs.release_name }}
          prerelease: ${{ needs.release-meta.outputs.channel != 'main' && needs.release-meta.outputs.channel != 'development' }}
          generate_release_notes: true
          files: dist/**
