name: Build Project

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check requirements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify secrets are set
        shell: bash
        run: bash ./.github/scripts/secrets.sh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      unity_version: ${{ steps.prepare.outputs.unity_version }}
      channel: ${{ steps.prepare.outputs.channel }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_name: ${{ steps.prepare.outputs.release_name }}
      platforms_json: ${{ steps.prepare.outputs.platforms_json }}
      platforms_output: ${{ steps.prepare.outputs.platforms_output }}
      artifact_pattern: ${{ steps.prepare.outputs.artifact_pattern }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare metadata
        id: prepare
        shell: bash
        run: bash ./.github/scripts/prepare.sh

  build:
    name: Build for ${{ matrix.displayPlatform }}
    runs-on: ${{ matrix.runsOn }}
    needs: [ check, prepare ]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms_json) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Cache Git LFS objects
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}-${{ github.sha }}
          restore-keys: |
            lfs-${{ runner.os }}-${{ hashFiles('.gitattributes') }}-
            lfs-${{ runner.os }}-

      - name: Fetch LFS objects
        run: git lfs pull

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**',
            'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ needs.prepare.outputs.unity_version }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Nox.GameBuilder.Pipeline.ExternalBuilder.Build
          buildsPath: build
          allowDirtyBuild: true
          manualExit: true
          customParameters: -noxReleaseVersion "${{ needs.prepare.outputs.version }}"
            -noxReleaseChannel "${{ needs.prepare.outputs.channel }}"
            -noxOutputPath "build/${{ matrix.targetPlatform }}"

      - name: Package artifact zip
        shell: bash
        run: bash ./.github/scripts/package.sh
        env:
          ARTIFACT_NAME: ${{ matrix.artifactName }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: artifacts/${{ matrix.artifactName }}

  release:
    name: Create release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [ build, prepare ]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare.outputs.artifact_pattern }}
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        shell: bash
        run: bash ./.github/scripts/hash.sh
        env:
          DIST_DIR: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
